# ===================================================================
# Site settings — these are the ones you edit
# ===================================================================
title: Dibya Deepta Mishra
tagline: "Economist working on markets, decisions, and AI"
description: >-
  I use economic models, causal inference, and machine learning to study
  demand, evaluate interventions, and understand incentives, with work on
  pricing, policy, and AI decisions.

url: "https://mishradibya.com"
baseurl: ""

# Contact and links — used in the nav and footer
email: dibyadeeptamishra@gmail.com
github: mishrad
linkedin: dibyamishra
scholar: "https://scholar.google.com/citations?view_op=list_works&hl=en&user=bpIx2vMAAAAJ&gmla=AH8HC4yMNh7ti6kUPoHpq3U3iszx08mt6pcTCDcOjRJrlkqNzvaBFUHAO3T9E0E2pcnkZSyIlmvjAaQUHr3u9T42Dj_1wpcaNg"            # paste your Google Scholar profile URL here
cv: /assets/files/cv.pdf
resume: /assets/files/resume.pdf

# ===================================================================
# Build settings — you rarely touch these
# ===================================================================
markdown: kramdown
permalink: /journal/:year/:month/:day/:title/
timezone: America/Chicago

plugins:
  - jekyll-feed

# Files that should never become public pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - notes
  - AGENTS.md
  - README.md
  - scripts
  - tests
  - tmp
  - output
  - '*.docx'
  - '**/*.docx'
  - cv_mishra.pdf
  - '**/cv_mishra.pdf'

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page
