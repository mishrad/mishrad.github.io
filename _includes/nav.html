<header class="site-header">
  <div class="wrap-wide header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/research-agenda/' | relative_url }}"{% if page.url contains '/research-agenda' %} aria-current="page"{% endif %}>Agenda</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/journal/' | relative_url }}"{% if page.url contains '/journal' %} aria-current="page"{% endif %}>Journal</a>
      <a href="{{ site.resume | relative_url }}">Resume</a>
      <a href="{{ site.cv | relative_url }}">CV</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme">
        <svg class="icon theme-icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
        <svg class="icon theme-icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
        <span class="theme-word theme-word-dark">Dark</span>
        <span class="theme-word theme-word-light">Light</span>
      </button>
    </nav>
  </div>
</header>
