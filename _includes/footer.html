<footer class="site-footer">
  <div class="wrap-wide">
    <div class="footer-links">
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="https://github.com/{{ site.github }}">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin }}">LinkedIn</a>
      {% if site.scholar != "" %}<a href="{{ site.scholar }}">Scholar</a>{% endif %}
      <a href="{{ site.cv | relative_url }}">CV</a>
    </div>
    <p class="disclaimer">
      Views expressed here are my own and do not represent those of my employer,
      Cornerstone Research. &copy; {{ 'now' | date: "%Y" }} {{ site.title }}.
    </p>
  </div>
</footer>
