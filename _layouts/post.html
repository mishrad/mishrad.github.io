---
layout: default
---
<main class="wrap">
  <article>
    <div class="post-header">
      <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
      <h1>{{ page.title }}</h1>
    </div>
    <div class="post-content">
      {{ content }}
    </div>
  </article>
  <div class="post-nav">
    <a href="{{ '/journal/' | relative_url }}">&larr; All entries</a>
  </div>
</main>
